<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Výběr tématu | Třídní kniha</title>

  <style>
    :root{
      --bg:#f4efe3;
      --paper:#fffdf8;
      --ink:#2d2a26;
      --muted:#746d63;
      --line:#d8cfbf;

      --christian:#6f4e37;
      --christian-light:#efe5da;

      --islam:#3e6b57;
      --islam-light:#e1eee8;

      --shadow:0 18px 45px rgba(55,42,28,.16);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      min-height:100%;
    }

    body{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(122,87,56,.08), transparent 28%),
        radial-gradient(circle at 85% 75%, rgba(62,107,87,.08), transparent 30%),
        var(--bg);
      padding:24px;
    }

    .page{
      width:min(1100px,100%);
      margin:0 auto;
      background:var(--paper);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      border-radius:24px;
      overflow:hidden;
    }

    .header{
      padding:42px 48px 30px;
      border-bottom:1px solid var(--line);
      text-align:center;
    }

    .eyebrow{
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:.76rem;
      font-weight:700;
      margin-bottom:10px;
      color:var(--muted);
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(2rem,5vw,3.3rem);
    }

    .subtitle{
      margin:0;
      color:var(--muted);
      line-height:1.6;
    }

    .student{
      margin-top:16px;
      font-size:.95rem;
      color:var(--muted);
    }

    .student strong{
      color:var(--ink);
    }

    .content{
      padding:38px 48px 46px;
    }

    .religion-box{
      display:flex;
      align-items:center;
      gap:16px;
      padding:18px 20px;
      border-radius:16px;
      margin-bottom:28px;
      border:1px solid var(--line);
    }

    .religion-box.christian{
      background:var(--christian-light);
    }

    .religion-box.islam{
      background:var(--islam-light);
    }

    .religion-icon{
      width:52px;
      height:52px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:white;
      font-size:1.7rem;
      flex:0 0 auto;
    }

    .christian .religion-icon{
      background:var(--christian);
    }

    .islam .religion-icon{
      background:var(--islam);
    }

    .religion-text h2{
      margin:0 0 5px;
      font-size:1.45rem;
    }

    .religion-text p{
      margin:0;
      color:var(--muted);
      font-size:.95rem;
    }

    .topics{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:18px;
    }

    .topic{
      min-height:155px;
      border:1px solid var(--line);
      border-radius:17px;
      background:white;
      padding:24px 20px;
      cursor:pointer;
      transition:.2s ease;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      position:relative;
      overflow:hidden;
    }

    .topic::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:5px;
      background:var(--accent);
    }

    .topic:hover{
      transform:translateY(-4px);
      box-shadow:0 12px 25px rgba(55,42,28,.12);
      border-color:var(--accent);
    }

    .topic-number{
      color:var(--muted);
      font-size:.8rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:18px;
    }

    .topic-title{
      font-size:1.3rem;
      font-weight:700;
      line-height:1.25;
    }

    .topic-footer{
      margin-top:18px;
      color:var(--accent);
      font-size:.88rem;
      font-weight:700;
    }

    .bottom{
      padding:0 48px 40px;
      display:flex;
      justify-content:center;
    }

    .back{
      border:none;
      background:none;
      color:var(--muted);
      font:inherit;
      cursor:pointer;
      padding:10px 14px;
    }

    .back:hover{
      color:var(--ink);
      text-decoration:underline;
    }

    .error-page{
      max-width:650px;
      margin:100px auto;
      padding:40px;
      background:white;
      border:1px solid var(--line);
      border-radius:20px;
      text-align:center;
      box-shadow:var(--shadow);
    }

    .error-page h1{
      font-size:2rem;
    }

    .error-page button{
      margin-top:20px;
      border:none;
      border-radius:10px;
      padding:13px 20px;
      background:#7a5738;
      color:white;
      font:inherit;
      cursor:pointer;
    }

    @media (max-width:850px){

      .topics{
        grid-template-columns:repeat(2,1fr);
      }

    }

    @media (max-width:600px){

      body{
        padding:12px;
      }

      .header{
        padding:32px 24px 24px;
      }

      .content{
        padding:28px 24px 34px;
      }

      .bottom{
        padding:0 24px 30px;
      }

      .topics{
        grid-template-columns:1fr;
      }

      .topic{
        min-height:130px;
      }
    }
  </style>
</head>

<body>

  <main id="app"></main>

  <script>

    /*
      Načtení údajů z předchozích stránek.
    */

    const studentName =
      localStorage.getItem("studentName");

    const selectedReligion =
      localStorage.getItem("selectedReligion");


    /*
      Seznam témat.
    */

    const topics = {

      krestanstvi: [
        "Vznik",
        "Symboly",
        "Organizace",
        "Rozdělení",
        "Kniha",
        "Kde se modlí",
        "Známý příběh",
        "Svátky",
        "Známí lidé"
      ],

      islam: [
        "Vznik",
        "Symboly",
        "5 pilířů",
        "Rozšíření",
        "Kniha",
        "Kde se modlí",
        "Poutní místo",
        "Arabská věda",
        "Známí lidé"
      ]

    };


    /*
      Informace pro vzhled a nadpis stránky.
    */

    const religionData = {

      krestanstvi: {
        name: "Křesťanství",
        icon: "✝",
        className: "christian",
        accent: "#6f4e37"
      },

      islam: {
        name: "Islám",
        icon: "☪",
        className: "islam",
        accent: "#3e6b57"
      }

    };


    const app =
      document.getElementById("app");


    /*
      Kontrola, zda je uživatel přihlášen
      a vybral si náboženství.
    */

    if (!studentName || !selectedReligion || !topics[selectedReligion]) {

      app.innerHTML = `
        <section class="error-page">
          <h1>Chybí předchozí výběr</h1>

          <p>
            Nejprve se přihlas a vyber si Křesťanství nebo Islám.
          </p>

          <button onclick="window.location.href='index.html'">
            Zpět na začátek
          </button>
        </section>
      `;

    } else {

      createPage();

    }


    /*
      Vytvoření celé stránky podle zvoleného náboženství.
    */

    function createPage(){

      const religion =
        religionData[selectedReligion];

      document.documentElement.style
        .setProperty("--accent", religion.accent);


      const topicCards =
        topics[selectedReligion]
        .map((topic, index) => {

          return `
            <article
              class="topic"
              onclick="selectTopic('${escapeForAttribute(topic)}')"
            >

              <div>

                <div class="topic-number">
                  Téma ${index + 1}
                </div>

                <div class="topic-title">
                  ${topic}
                </div>

              </div>

              <div class="topic-footer">
                Vybrat téma →
              </div>

            </article>
          `;

        })
        .join("");


      app.innerHTML = `

        <section class="page">

          <header class="header">

            <div class="eyebrow">
              Třídní kniha
            </div>

            <h1>
              Vyber své téma
            </h1>

            <p class="subtitle">
              Vyber téma, které jsi zpracovával/a
              v předchozí hodině.
            </p>

            <div class="student">
              Přihlášen/a:
              <strong>${escapeHTML(studentName)}</strong>
            </div>

          </header>


          <section class="content">

            <div class="religion-box ${religion.className}">

              <div class="religion-icon">
                ${religion.icon}
              </div>

              <div class="religion-text">

                <h2>
                  ${religion.name}
                </h2>

                <p>
                  Vyber jednu z devíti oblastí.
                </p>

              </div>

            </div>


            <div class="topics">
              ${topicCards}
            </div>

          </section>


          <div class="bottom">

            <button
              class="back"
              onclick="window.location.href='vyber.html'"
            >
              ← Zpět na výběr náboženství
            </button>

          </div>

        </section>
      `;

    }


    /*
      Po kliknutí na téma ho uložíme
      a přejdeme na stránku se zápisem.
    */

    function selectTopic(topic){

      localStorage.setItem(
        "selectedTopic",
        topic
      );

      window.location.href =
        "zapis.html";

    }


    /*
      Ochrana textu při vykreslování.
    */

    function escapeHTML(text){

      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /*
      Používá se při vložení názvu tématu
      do onclick atributu.
    */

    function escapeForAttribute(text){

      return text
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");

    }

  </script>

</body>
</html>
