<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zápis tématu | Třídní kniha</title>

  <style>
    :root{
      --bg:#f4efe3;
      --paper:#fffdf8;
      --ink:#2d2a26;
      --muted:#746d63;
      --line:#d8cfbf;

      --christian:#6f4e37;
      --christian-light:#efe5da;

      --islam:#3e6b57;
      --islam-light:#e1eee8;

      --accent:#7a5738;
      --accent-light:#efe5da;

      --success:#3e6b57;
      --danger:#a3342d;
      --warning:#9b6b22;

      --shadow:0 18px 45px rgba(55,42,28,.16);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      min-height:100%;
    }

    body{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      color:var(--ink);

      background:
        radial-gradient(circle at 15% 20%, rgba(122,87,56,.08), transparent 28%),
        radial-gradient(circle at 85% 75%, rgba(62,107,87,.08), transparent 30%),
        var(--bg);

      padding:24px;
    }

    .page{
      width:min(950px,100%);
      margin:0 auto;

      background:var(--paper);

      border:1px solid var(--line);
      border-radius:24px;

      box-shadow:var(--shadow);

      overflow:hidden;
    }

    .header{
      padding:38px 46px 30px;

      border-bottom:1px solid var(--line);
    }

    .eyebrow{
      text-transform:uppercase;
      letter-spacing:.15em;

      font-size:.75rem;
      color:var(--muted);

      font-weight:700;

      margin-bottom:10px;
    }

    h1{
      margin:0;

      font-size:clamp(2rem,5vw,3.4rem);
      line-height:1.1;
    }

    .content{
      padding:38px 46px 46px;
    }

    .connection{
      display:flex;
      align-items:center;
      gap:9px;

      margin-bottom:20px;

      padding:11px 14px;

      border:1px solid var(--line);
      border-radius:11px;

      background:white;

      font-size:.88rem;
      color:var(--muted);
    }

    .connection-dot{
      width:10px;
      height:10px;

      border-radius:50%;

      background:var(--warning);

      flex:0 0 auto;
    }

    .connection.connected .connection-dot{
      background:var(--success);
    }

    .connection.error .connection-dot{
      background:var(--danger);
    }

    .info-box{
      border:1px solid var(--line);

      background:var(--accent-light);

      border-radius:18px;

      padding:22px 24px;

      margin-bottom:30px;

      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .info-item{
      min-width:0;
    }

    .info-label{
      display:block;

      text-transform:uppercase;
      letter-spacing:.08em;

      font-size:.72rem;
      color:var(--muted);

      margin-bottom:6px;

      font-weight:700;
    }

    .info-value{
      font-size:1.08rem;

      font-weight:700;

      word-wrap:break-word;
    }

    .topic-heading{
      margin-bottom:14px;
    }

    .topic-heading h2{
      margin:0 0 8px;

      font-size:1.7rem;
    }

    .topic-heading p{
      margin:0;

      color:var(--muted);

      line-height:1.6;
    }

    textarea{
      width:100%;

      min-height:340px;

      resize:vertical;

      border:1px solid #cfc3b1;

      border-radius:16px;

      padding:20px;

      background:white;

      color:var(--ink);

      font-family:Georgia, "Times New Roman", serif;

      font-size:1.05rem;
      line-height:1.7;

      outline:none;

      transition:.2s ease;
    }

    textarea:focus{
      border-color:var(--accent);

      box-shadow:
        0 0 0 4px rgba(122,87,56,.10);
    }

    .counter{
      text-align:right;

      color:var(--muted);

      font-size:.85rem;

      margin-top:8px;
    }

    .message{
      min-height:26px;

      margin-top:14px;

      font-size:.95rem;

      font-weight:700;
    }

    .message.success{
      color:var(--success);
    }

    .message.error{
      color:var(--danger);
    }

    .message.warning{
      color:var(--warning);
    }

    .buttons{
      display:flex;

      gap:12px;

      margin-top:18px;
    }

    button{
      border:none;

      border-radius:12px;

      padding:14px 20px;

      font:700 1rem Georgia, "Times New Roman", serif;

      cursor:pointer;

      transition:.2s ease;
    }

    .save{
      flex:1;

      background:var(--accent);

      color:white;
    }

    .save:hover:not(:disabled){
      filter:brightness(.9);

      transform:translateY(-1px);
    }

    .save:disabled{
      opacity:.55;

      cursor:not-allowed;
    }

    .back{
      background:white;

      color:var(--muted);

      border:1px solid var(--line);
    }

    .back:hover{
      color:var(--ink);

      border-color:#b9ad9b;
    }

    .saved-box{
      display:none;

      margin-top:30px;

      border:1px solid #b9d2c5;

      background:#eef6f2;

      border-radius:18px;

      padding:24px;

      text-align:center;
    }

    .saved-box.show{
      display:block;
    }

    .saved-box h3{
      margin:0 0 10px;

      color:var(--success);
    }

    .saved-box p{
      margin:0;

      color:var(--muted);

      line-height:1.6;
    }

    .saved-actions{
      display:flex;

      gap:10px;

      margin-top:18px;

      justify-content:center;

      flex-wrap:wrap;
    }

    .saved-actions button{
      background:white;

      border:1px solid #b9d2c5;

      color:var(--success);
    }

    .error-page{
      max-width:650px;

      margin:100px auto;

      padding:40px;

      background:white;

      border:1px solid var(--line);

      border-radius:20px;

      text-align:center;

      box-shadow:var(--shadow);
    }

    .error-page h1{
      font-size:2rem;
    }

    .error-page button{
      margin-top:20px;

      background:var(--accent);

      color:white;
    }

    @media(max-width:700px){

      body{
        padding:12px;
      }

      .header{
        padding:30px 24px 24px;
      }

      .content{
        padding:28px 24px 34px;
      }

      .info-box{
        grid-template-columns:1fr;

        gap:14px;
      }

      textarea{
        min-height:300px;
      }

      .buttons{
        flex-direction:column;
      }

      .save,
      .back{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <main id="app"></main>


  <script type="module">

    /*
      =============================================
      FIREBASE IMPORTY
      =============================================
    */

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    /*
      =============================================
      FIREBASE KONFIGURACE
      =============================================
    */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBi0BPMajByRf987HFeTZIDHFvJVm7XR1g",

      authDomain:
        "nabozenstvi-8fc06.firebaseapp.com",

      projectId:
        "nabozenstvi-8fc06",

      storageBucket:
        "nabozenstvi-8fc06.firebasestorage.app",

      messagingSenderId:
        "409593452616",

      appId:
        "1:409593452616:web:77e75288e6b5c0d300e07d",

      measurementId:
        "G-8PXRR79VV1"

    };


    /*
      =============================================
      INICIALIZACE FIREBASE
      =============================================
    */

    const firebaseApp =
      initializeApp(
        firebaseConfig
      );


    const db =
      getFirestore(
        firebaseApp
      );


    const auth =
      getAuth(
        firebaseApp
      );


    let currentUser = null;


    /*
      =============================================
      DATA Z LOCALSTORAGE
      =============================================
    */

    const studentName =
      localStorage.getItem(
        "studentName"
      );


    const selectedReligion =
      localStorage.getItem(
        "selectedReligion"
      );


    const selectedTopic =
      localStorage.getItem(
        "selectedTopic"
      );


    const religionData = {

      krestanstvi: {

        name:
          "Křesťanství",

        color:
          "#6f4e37",

        light:
          "#efe5da",

        icon:
          "✝"

      },


      islam: {

        name:
          "Islám",

        color:
          "#3e6b57",

        light:
          "#e1eee8",

        icon:
          "☪"

      }

    };


    const app =
      document.getElementById(
        "app"
      );


    /*
      =============================================
      KONTROLA PŘEDCHOZÍHO VÝBĚRU
      =============================================
    */

    if(
      !studentName ||
      !selectedReligion ||
      !selectedTopic ||
      !religionData[
        selectedReligion
      ]
    ){

      showErrorPage();

    }

    else{

      createPage();

      connectFirebase();

    }


    /*
      =============================================
      ANONYMNÍ PŘIHLÁŠENÍ FIREBASE
      =============================================
    */

    async function connectFirebase(){

      setConnectionState(
        "connecting",
        "Připojuji k databázi..."
      );


      try{

        await signInAnonymously(
          auth
        );

      }

      catch(error){

  console.error(
    "Chyba anonymního přihlášení:",
    error
  );

  setConnectionState(
    "error",
    "Firebase chyba: " + error.code
  );

  const message =
    document.getElementById("message");

  if(message){

    message.textContent =
      "Firebase chyba: " +
      error.code +
      " – " +
      error.message;

    message.className =
      "message error";
  }
}

    /*
      Sledujeme stav uživatele.
    */

    onAuthStateChanged(
      auth,
      user => {

        currentUser = user;


        const saveButton =
          document.getElementById(
            "saveButton"
          );


        if(user){

          setConnectionState(
            "connected",
            "Připojeno k databázi."
          );


          if(saveButton){

            saveButton.disabled =
              false;

          }

        }

      }
    );


    /*
      =============================================
      VYTVOŘENÍ STRÁNKY
      =============================================
    */

    function createPage(){

      const religion =
        religionData[
          selectedReligion
        ];


      document.documentElement.style
        .setProperty(
          "--accent",
          religion.color
        );


      document.documentElement.style
        .setProperty(
          "--accent-light",
          religion.light
        );


      app.innerHTML = `

        <section class="page">

          <header class="header">

            <div class="eyebrow">
              ${religion.icon}
              ${religion.name}
            </div>

            <h1>
              ${escapeHTML(
                selectedTopic
              )}
            </h1>

          </header>


          <section class="content">

            <div
              id="connection"
              class="connection"
            >

              <div
                class="connection-dot"
              ></div>

              <span
                id="connectionText"
              >
                Připojuji k databázi...
              </span>

            </div>


            <div class="info-box">

              <div class="info-item">

                <span class="info-label">
                  Žák
                </span>

                <div class="info-value">

                  ${escapeHTML(
                    studentName
                  )}

                </div>

              </div>


              <div class="info-item">

                <span class="info-label">
                  Náboženství
                </span>

                <div class="info-value">
                  ${religion.name}
                </div>

              </div>


              <div class="info-item">

                <span class="info-label">
                  Téma
                </span>

                <div class="info-value">

                  ${escapeHTML(
                    selectedTopic
                  )}

                </div>

              </div>

            </div>


            <div class="topic-heading">

              <h2>
                Tvůj zápis
              </h2>

              <p>
                Napiš vlastními slovy všechny důležité informace,
                které jsi o svém tématu zjistil/a.
              </p>

            </div>


            <textarea
              id="studentText"
              maxlength="3000"
              placeholder="Sem napiš svůj zápis..."
            ></textarea>


            <div class="counter">

              <span
                id="characterCount"
              >
                0
              </span>

              / 3000 znaků

            </div>


            <div
              id="message"
              class="message"
            ></div>


            <div class="buttons">

              <button
                class="back"
                onclick="window.location.href='tema.html'"
              >
                ← Zpět
              </button>


              <button
                id="saveButton"
                class="save"
                disabled
              >
                ULOŽIT PŘÍSPĚVEK
              </button>

            </div>


            <div
              id="savedBox"
              class="saved-box"
            >

              <h3>
                ✓ Příspěvek byl uložen online
              </h3>

              <p>
                Odpověď je nyní uložená
                ve společné databázi.
              </p>


              <div class="saved-actions">

                <button
                  onclick="window.location.href='tema.html'"
                >
                  Vybrat jiné téma
                </button>


                <button
                  onclick="window.location.href='vyber.html'"
                >
                  Změnit náboženství
                </button>

              </div>

            </div>

          </section>

        </section>

      `;


      /*
        Lokální záloha rozepsaného textu.
      */

      loadLocalDraft();


      const textarea =
        document.getElementById(
          "studentText"
        );


      textarea.addEventListener(
        "input",
        function(){

          updateCounter();

          saveLocalDraft();

        }
      );


      document.getElementById(
        "saveButton"
      )
      .addEventListener(
        "click",
        saveAnswer
      );


      updateCounter();

    }


    /*
      =============================================
      ULOŽENÍ DO FIRESTORE
      =============================================
    */

    async function saveAnswer(){

      const textarea =
        document.getElementById(
          "studentText"
        );


      const message =
        document.getElementById(
          "message"
        );


      const savedBox =
        document.getElementById(
          "savedBox"
        );


      const saveButton =
        document.getElementById(
          "saveButton"
        );


      const text =
        textarea.value.trim();


      if(
        text.length < 10
      ){

        message.textContent =
          "Napiš prosím alespoň několik vět o svém tématu.";


        message.className =
          "message error";


        savedBox.classList.remove(
          "show"
        );


        textarea.focus();

        return;

      }


      if(
        !currentUser
      ){

        message.textContent =
          "Ještě nejsi připojen/a k databázi. Chvíli počkej a zkus to znovu.";


        message.className =
          "message warning";


        return;

      }


      saveButton.disabled =
        true;


      saveButton.textContent =
        "UKLÁDÁM...";


      message.textContent =
        "Ukládám odpověď online...";


      message.className =
        "message warning";


      /*
        Jednoznačné ID dokumentu.

        Stejný žák + stejné téma
        = vždy stejný dokument.

        Díky tomu se při opětovném uložení
        nevytvoří duplicitní odpověď,
        ale aktualizuje se původní.
      */

      const answerId =
        createAnswerId(
          currentUser.uid,
          selectedReligion,
          selectedTopic
        );


      const answerData = {

        student:
          studentName,

        religion:
          selectedReligion,

        religionName:
          religionData[
            selectedReligion
          ].name,

        topic:
          selectedTopic,

        text:
          text,

        uid:
          currentUser.uid,

        savedAt:
          serverTimestamp()

      };


      try{

        await setDoc(

          doc(
            db,
            "answers",
            answerId
          ),

          answerData

        );


        message.textContent =
          "Příspěvek byl úspěšně uložen do společné databáze.";


        message.className =
          "message success";


        savedBox.classList.add(
          "show"
        );


        /*
          Lokální zálohu necháme.
          Pokud chceš, můžeš ji místo toho smazat.
        */

        saveLocalDraft();

      }

      catch(error){

        console.error(
          "Chyba při ukládání do Firebase:",
          error
        );


        message.textContent =
          "Odpověď se nepodařilo uložit. Zkontroluj internet nebo pravidla Firestore.";


        message.className =
          "message error";


        savedBox.classList.remove(
          "show"
        );

      }

      finally{

        saveButton.disabled =
          false;


        saveButton.textContent =
          "ULOŽIT PŘÍSPĚVEK";

      }

    }


    /*
      =============================================
      ID ODPOVĚDI
      =============================================
    */

    function createAnswerId(
      uid,
      religion,
      topic
    ){

      return (
        uid +
        "_" +
        normalizeText(
          religion
        ) +
        "_" +
        normalizeText(
          topic
        )
      );

    }


    /*
      =============================================
      LOKÁLNÍ ZÁLOHA ROZEPSANÉHO TEXTU
      =============================================
    */

    function createDraftKey(){

      return (
        "draft_" +
        normalizeText(
          studentName
        ) +
        "_" +
        normalizeText(
          selectedReligion
        ) +
        "_" +
        normalizeText(
          selectedTopic
        )
      );

    }


    function saveLocalDraft(){

      const textarea =
        document.getElementById(
          "studentText"
        );


      if(
        !textarea
      ){
        return;
      }


      localStorage.setItem(
        createDraftKey(),
        textarea.value
      );

    }


    function loadLocalDraft(){

      const textarea =
        document.getElementById(
          "studentText"
        );


      const savedDraft =
        localStorage.getItem(
          createDraftKey()
        );


      if(
        textarea &&
        savedDraft
      ){

        textarea.value =
          savedDraft;

      }

    }


    /*
      =============================================
      STAV PŘIPOJENÍ
      =============================================
    */

    function setConnectionState(
      state,
      text
    ){

      const box =
        document.getElementById(
          "connection"
        );


      const label =
        document.getElementById(
          "connectionText"
        );


      if(
        !box ||
        !label
      ){
        return;
      }


      box.classList.remove(
        "connected",
        "error"
      );


      if(
        state === "connected"
      ){

        box.classList.add(
          "connected"
        );

      }


      if(
        state === "error"
      ){

        box.classList.add(
          "error"
        );

      }


      label.textContent =
        text;

    }


    /*
      =============================================
      POČÍTADLO ZNAKŮ
      =============================================
    */

    function updateCounter(){

      const textarea =
        document.getElementById(
          "studentText"
        );


      const counter =
        document.getElementById(
          "characterCount"
        );


      if(
        textarea &&
        counter
      ){

        counter.textContent =
          textarea.value.length;

      }

    }


    /*
      =============================================
      CHYBOVÁ STRÁNKA
      =============================================
    */

    function showErrorPage(){

      app.innerHTML = `

        <section class="error-page">

          <h1>
            Chybí výběr tématu
          </h1>

          <p>
            Nejprve se přihlas,
            vyber náboženství
            a potom konkrétní téma.
          </p>

          <button
            onclick="window.location.href='index.html'"
          >
            Zpět na začátek
          </button>

        </section>

      `;

    }


    /*
      =============================================
      NORMALIZACE TEXTU
      =============================================
    */

    function normalizeText(text){

      return text
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .replace(
          /[^a-z0-9]+/g,
          "_"
        )
        .replace(
          /^_+|_+$/g,
          ""
        );

    }


    /*
      =============================================
      OCHRANA HTML
      =============================================
    */

    function escapeHTML(text){

      if(
        typeof text !== "string"
      ){
        return "";
      }


      return text
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }

  </script>

</body>
</html>
