<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Výběr náboženství | Třídní kniha</title>

  <style>
    :root{
      --bg:#f4efe3;
      --paper:#fffdf8;
      --ink:#2d2a26;
      --muted:#746d63;
      --line:#d8cfbf;

      --christian:#6f4e37;
      --christian-dark:#513725;

      --islam:#3e6b57;
      --islam-dark:#2d5141;

      --shadow:0 18px 45px rgba(55,42,28,.16);
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      min-height:100%;
    }

    body{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      color:var(--ink);

      background:
        radial-gradient(circle at 15% 20%, rgba(122,87,56,.08), transparent 28%),
        radial-gradient(circle at 85% 75%, rgba(62,107,87,.08), transparent 30%),
        var(--bg);

      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .page{
      width:min(1000px,100%);
      background:var(--paper);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      border-radius:24px;
      overflow:hidden;
      padding:52px;
    }

    .top{
      text-align:center;
      margin-bottom:42px;
    }

    .eyebrow{
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:.75rem;
      color:#7a5738;
      font-weight:700;
      margin-bottom:12px;
    }

    h1{
      margin:0 0 12px;
      font-size:clamp(2rem,5vw,3.5rem);
    }

    .welcome{
      color:var(--muted);
      font-size:1.05rem;
      line-height:1.6;
    }

    .student-name{
      font-weight:700;
      color:var(--ink);
    }

    .choices{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:26px;
    }

    .choice{
      border:1px solid var(--line);
      border-radius:20px;
      padding:38px 30px;
      text-align:center;
      cursor:pointer;
      transition:.25s ease;
      background:#fff;
      min-height:290px;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    .choice:hover{
      transform:translateY(-6px);
      box-shadow:0 14px 30px rgba(55,42,28,.12);
    }

    .symbol{
      width:86px;
      height:86px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:2.8rem;
      color:white;
      margin-bottom:22px;
    }

    .christian .symbol{
      background:var(--christian);
    }

    .islam .symbol{
      background:var(--islam);
    }

    .choice h2{
      margin:0 0 12px;
      font-size:1.8rem;
    }

    .choice p{
      margin:0;
      color:var(--muted);
      line-height:1.6;
      max-width:310px;
    }

    .christian:hover{
      border-color:var(--christian);
    }

    .islam:hover{
      border-color:var(--islam);
    }

    .buttons{
      margin-top:35px;
      display:flex;
      justify-content:center;
    }

    .back{
      background:none;
      border:none;
      color:var(--muted);
      font-family:inherit;
      font-size:.95rem;
      cursor:pointer;
      padding:10px 16px;
    }

    .back:hover{
      color:var(--ink);
      text-decoration:underline;
    }

    @media (max-width:700px){

      .page{
        padding:34px 22px;
      }

      .choices{
        grid-template-columns:1fr;
      }

      .choice{
        min-height:220px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="top">

      <div class="eyebrow">
        Třídní kniha
      </div>

      <h1>
        Vyber své náboženství
      </h1>

      <div class="welcome">
        Přihlášen/a:
        <span class="student-name" id="studentName"></span>
      </div>

    </section>


    <section class="choices">

      <div
        class="choice christian"
        onclick="selectReligion('krestanstvi')"
      >

        <div class="symbol">
          ✝
        </div>

        <h2>
          Křesťanství
        </h2>

        <p>
          Vyber si své téma z oblasti křesťanství
          a přidej svůj příspěvek do společné knihy.
        </p>

      </div>


      <div
        class="choice islam"
        onclick="selectReligion('islam')"
      >

        <div class="symbol">
          ☪
        </div>

        <h2>
          Islám
        </h2>

        <p>
          Vyber si své téma z oblasti islámu
          a přidej svůj příspěvek do společné knihy.
        </p>

      </div>

    </section>


    <div class="buttons">

      <button
        class="back"
        onclick="window.location.href='index.html'"
      >
        ← Zpět na přihlášení
      </button>

    </div>

  </main>


  <script>

    /*
      Načtení jména z předchozí stránky.
    */

    const studentName =
      localStorage.getItem("studentName");


    /*
      Pokud se někdo dostane přímo na tuto stránku
      bez přihlášení, vrátíme ho na index.html.
    */

    if (!studentName) {

      window.location.href = "index.html";

    } else {

      document.getElementById("studentName")
        .textContent = studentName;

    }


    /*
      Výběr náboženství.
    */

    function selectReligion(religion) {

      /*
        Uložíme výběr do localStorage.
      */

      localStorage.setItem(
        "selectedReligion",
        religion
      );


      /*
        Přesun na další stránku,
        kde budou jednotlivá témata.
      */

      window.location.href = "tema.html";

    }

  </script>

</body>
</html>
