<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Tisk knížečky | Křesťanství × Islám
  </title>


  <style>

    :root{

      --bg:#eee8dd;
      --paper:#ffffff;
      --ink:#2d2a26;
      --muted:#746d63;
      --line:#cfc5b6;

      --christian:#6f4e37;
      --islam:#3e6b57;

      --shadow:
        0 18px 45px
        rgba(55,42,28,.14);

    }


    *{
      box-sizing:border-box;
    }


    html,
    body{

      margin:0;

      min-height:100%;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color:
        var(--ink);

      background:
        var(--bg);

    }


    button{

      font-family:
        inherit;

    }


    /* ======================================= */
    /* HORNÍ OVLÁDÁNÍ */
    /* ======================================= */

    .toolbar{

      position:sticky;

      top:0;

      z-index:100;

      display:flex;

      justify-content:
        space-between;

      align-items:center;

      gap:20px;

      padding:
        14px 22px;

      background:#2d2a26;

      color:white;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.18);

    }


    .toolbar-title{

      font-size:1.05rem;

      font-weight:700;

    }


    .toolbar-buttons{

      display:flex;

      flex-wrap:wrap;

      gap:9px;

    }


    .toolbar-button{

      padding:
        9px 14px;

      border:
        1px solid
        rgba(255,255,255,.25);

      border-radius:9px;

      background:
        transparent;

      color:white;

      cursor:pointer;

      transition:.2s;

    }


    .toolbar-button:hover{

      background:
        rgba(255,255,255,.1);

    }


    .toolbar-button.active{

      background:white;

      color:#2d2a26;

      border-color:white;

    }


    .toolbar-button.print{

      background:#ffffff;

      color:#2d2a26;

      border-color:#ffffff;

      font-weight:700;

    }


    /* ======================================= */
    /* HLAVNÍ OBSAH */
    /* ======================================= */

    .wrapper{

      width:
        min(
          1250px,
          calc(100% - 30px)
        );

      margin:
        28px auto 70px;

    }


    .intro{

      background:#fffdf8;

      border:
        1px solid
        var(--line);

      border-radius:20px;

      box-shadow:
        var(--shadow);

      padding:
        28px 32px;

      margin-bottom:24px;

    }


    .intro-label{

      text-transform:
        uppercase;

      letter-spacing:.14em;

      font-size:.72rem;

      color:
        var(--muted);

      font-weight:700;

      margin-bottom:7px;

    }


    .intro h1{

      margin:
        0 0 10px;

      font-size:
        clamp(
          2rem,
          5vw,
          3rem
        );

    }


    .intro p{

      margin:0;

      color:
        var(--muted);

      line-height:1.6;

    }


    /* ======================================= */
    /* VAROVÁNÍ */
    /* ======================================= */

    .warning{

      margin-top:18px;

      padding:
        12px 15px;

      border:
        1px solid
        #d7bc8c;

      border-radius:12px;

      background:#fff8e9;

      color:#71551e;

      font-size:.9rem;

      line-height:1.5;

    }


    /* ======================================= */
    /* A4 PAPÍR */
    /* ======================================= */

    .paper-shell{

      overflow:auto;

      padding:
        18px 0;

    }


    .booklet{

      /*
        A4 NALEŽATO
        297 × 210 mm
      */

      width:297mm;

      height:210mm;

      margin:
        0 auto;

      display:grid;

      grid-template-columns:
        repeat(4, 1fr);

      grid-template-rows:
        repeat(2, 1fr);

      background:white;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.17);

      overflow:hidden;

    }


    /* ======================================= */
    /* JEDNA MINI STRÁNKA */
    /* ======================================= */

    .mini-page{

      position:relative;

      overflow:hidden;

      padding:
        8mm 7mm;

      border-right:
        .3mm dashed
        #aaa;

      border-bottom:
        .3mm dashed
        #aaa;

      background:white;

    }


    /*
      Pravý sloupec:
      nechceme pravý okraj.
    */

    .mini-page:nth-child(4),
    .mini-page:nth-child(8){

      border-right:none;

    }


    /*
      Spodní řada:
      nechceme dolní okraj.
    */

    .mini-page:nth-child(n+5){

      border-bottom:none;

    }


    /* ======================================= */
    /* SPODNÍ ŘADA OTOČENÁ */
    /* ======================================= */

    .mini-page.bottom{

      transform:
        rotate(180deg);

    }


    /* ======================================= */
    /* OBSAH MINI STRÁNKY */
    /* ======================================= */

    .page-inner{

      height:100%;

      display:flex;

      flex-direction:column;

    }


    .page-number{

      text-transform:
        uppercase;

      letter-spacing:.1em;

      font-size:7.5pt;

      color:
        var(--muted);

      margin-bottom:3mm;

    }


    .topic-title{

      margin:
        0 0 4mm;

      padding-bottom:2.5mm;

      border-bottom:
        .4mm solid
        currentColor;

      font-size:
        15pt;

      line-height:1.1;

      font-weight:700;

    }


    .booklet.christian
    .topic-title{

      color:
        var(--christian);

    }


    .booklet.islam
    .topic-title{

      color:
        var(--islam);

    }


    .topic-text{

      flex:1;

      font-size:
        9.1pt;

      line-height:
        1.35;

      color:
        var(--ink);

      white-space:
        pre-wrap;

      overflow-wrap:
        anywhere;

      overflow:hidden;

    }


    .empty{

      color:#aaa;

      font-style:
        italic;

    }


    /* ======================================= */
    /* TITULNÍ STRÁNKA */
    /* ======================================= */

    .cover-page
    .page-inner{

      justify-content:
        center;

      align-items:center;

      text-align:center;

    }


    .cover-symbol{

      font-size:
        25pt;

      margin-bottom:
        5mm;

    }


    .cover-title{

      margin:0;

      font-size:
        20pt;

      line-height:1.05;

    }


    .cover-subtitle{

      margin-top:
        4mm;

      color:
        var(--muted);

      font-size:
        9pt;

    }


    /* ======================================= */
    /* STŘIH / OHYB */
    /* ======================================= */

    .cut-line{

      position:absolute;

      z-index:20;

      pointer-events:none;

      /*
        Znázornění středového řezu.
        V tisku ho můžeš schovat,
        pokud ho nechceš mít viditelný.
      */

      left:25%;

      right:25%;

      top:50%;

      border-top:
        .35mm dashed
        rgba(180,50,50,.55);

    }


    .cut-label{

      position:absolute;

      left:50%;

      top:50%;

      transform:
        translate(-50%,-50%);

      padding:
        1mm 2mm;

      background:white;

      color:#b44b43;

      font-size:
        6pt;

      letter-spacing:.05em;

      z-index:21;

    }


    /* ======================================= */
    /* TISK */
    /* ======================================= */

    @media print{

      @page{

        size:
          A4 landscape;

        margin:0;

      }


      html,
      body{

        width:297mm;

        height:210mm;

        margin:0;

        padding:0;

        background:white;

      }


      .toolbar,
      .intro{

        display:none
        !important;

      }


      .wrapper{

        width:297mm;

        height:210mm;

        margin:0;

        padding:0;

      }


      .paper-shell{

        width:297mm;

        height:210mm;

        margin:0;

        padding:0;

        overflow:hidden;

      }


      .booklet{

        width:297mm;

        height:210mm;

        margin:0;

        box-shadow:none;

        page-break-after:avoid;

        break-after:avoid;

      }


      /*
        Pokud nechceš při finálním tisku
        vidět červenou značku střihu,
        změň display:block na none.
      */

      .cut-line,
      .cut-label{

        display:block;

      }

    }


    /* ======================================= */
    /* MENŠÍ OBRAZOVKY */
    /* ======================================= */

    @media(max-width:900px){

      .toolbar{

        flex-direction:
          column;

        align-items:
          flex-start;

      }


      .booklet{

        transform-origin:
          top left;

      }

    }

  </style>

</head>


<body>


  <!-- ======================================= -->
  <!-- OVLÁDÁNÍ -->
  <!-- ======================================= -->

  <header class="toolbar">

    <div class="toolbar-title">

      Tisk mini knížečky

    </div>


    <div class="toolbar-buttons">


      <button
        id="christianButton"
        class="toolbar-button active"
        onclick="showReligion('krestanstvi')"
      >
        ✝ Křesťanství
      </button>


      <button
        id="islamButton"
        class="toolbar-button"
        onclick="showReligion('islam')"
      >
        ☪ Islám
      </button>


      <button
        class="toolbar-button"
        onclick="window.location.href='ucitel.html'"
      >
        ← Upravit texty
      </button>


      <button
        class="toolbar-button print"
        onclick="window.print()"
      >
        PDF / TISK
      </button>

    </div>

  </header>


  <!-- ======================================= -->
  <!-- OBSAH -->
  <!-- ======================================= -->

  <main class="wrapper">


    <section class="intro">

      <div class="intro-label">

        Náhled pro tisk

      </div>


      <h1 id="previewTitle">

        Křesťanství

      </h1>


      <p>

        Jedna A4 naležato.
        Po vytištění se papír složí
        do osmistránkové mini knížečky.

      </p>


      <div class="warning">

        Jedna taková A4 vytvoří přesně
        <strong>8 stran</strong>.
        Proto je níže nastaveno osm pozic.
        Deváté téma budeme muset vyřešit
        samostatně – například druhým listem
        nebo úpravou obsahu.

      </div>

    </section>


    <div class="paper-shell">


      <section
        id="booklet"
        class="booklet christian"
      >

        <!--
          Sem JavaScript automaticky
          vloží 8 polí.
        -->

      </section>


    </div>

  </main>


  <script>

    /* ================================================= */
    /* TÉMATA */
    /* ================================================= */

    const topics = {

      krestanstvi: [

        "Vznik",
        "Symboly",
        "Organizace",
        "Rozdělení",
        "Kniha",
        "Kde se modlí",
        "Známý příběh",
        "Svátky",
        "Známí lidé"

      ],


      islam: [

        "Vznik",
        "Symboly",
        "5 pilířů",
        "Rozšíření",
        "Kniha",
        "Kde se modlí",
        "Poutní místo",
        "Arabská věda",
        "Známí lidé"

      ]

    };


    /* ================================================= */
    /* ROZLOŽENÍ KNIŽEČKY */
    /* ================================================= */

    /*
      Toto pole určuje obsah STRAN 1–8.

      DŮLEŽITÉ:
      není to pořadí bloků na A4,
      ale skutečné pořadí stran
      po složení knížky.

      Teď je tam jako první strana titulní.
    */

    const bookletLayout = {

      krestanstvi: [

        "__COVER__",

        "Vznik",

        "Symboly",

        "Organizace",

        "Rozdělení",

        "Kniha",

        "Kde se modlí",

        "Známý příběh"

      ],


      islam: [

        "__COVER__",

        "Vznik",

        "Symboly",

        "5 pilířů",

        "Rozšíření",

        "Kniha",

        "Kde se modlí",

        "Poutní místo"

      ]

    };


    /* ================================================= */
    /* IMPOZICE NA PAPÍŘ */
    /* ================================================= */

    /*
      Fyzické rozložení podle tvé předlohy:

      HORNÍ:
      8 | 1 | 2 | 3

      SPODNÍ:
      7 | 6 | 5 | 4

      Spodní řada se navíc otočí o 180°.
    */

    const printOrder = [

      8,
      1,
      2,
      3,

      7,
      6,
      5,
      4

    ];


    /* ================================================= */
    /* NÁBOŽENSTVÍ */
    /* ================================================= */

    const religionInfo = {

      krestanstvi: {

        name:
          "Křesťanství",

        icon:
          "✝",

        className:
          "christian"

      },


      islam: {

        name:
          "Islám",

        icon:
          "☪",

        className:
          "islam"

      }

    };


    /* ================================================= */
    /* FINÁLNÍ TEXTY */
    /* ================================================= */

    let finalTexts = {};


    try{

      finalTexts =
        JSON.parse(
          localStorage.getItem(
            "finalBookTexts"
          )
        ) || {};

    }

    catch(error){

      finalTexts = {};

    }


    /* ================================================= */
    /* AKTUÁLNÍ VÝBĚR */
    /* ================================================= */

    let currentReligion =
      "krestanstvi";


    renderBooklet();


    /* ================================================= */
    /* PŘEPNUTÍ NÁBOŽENSTVÍ */
    /* ================================================= */

    window.showReligion =
      function(religion){

        currentReligion =
          religion;


        document
          .getElementById(
            "christianButton"
          )
          .classList.toggle(

            "active",

            religion ===
              "krestanstvi"

          );


        document
          .getElementById(
            "islamButton"
          )
          .classList.toggle(

            "active",

            religion ===
              "islam"

          );


        renderBooklet();

      };


    /* ================================================= */
    /* VYKRESLENÍ KNIŽEČKY */
    /* ================================================= */

    function renderBooklet(){

      const booklet =
        document.getElementById(
          "booklet"
        );


      const info =
        religionInfo[
          currentReligion
        ];


      booklet.className =
        "booklet " +
        info.className;


      document
        .getElementById(
          "previewTitle"
        )
        .textContent =
          info.name;


      booklet.innerHTML =
        "";


      /*
        Vytvoříme 8 fyzických polí
        podle printOrder.
      */

      printOrder.forEach(

        (
          pageNumber,
          physicalIndex
        ) => {

          const miniPage =
            createMiniPage(
              pageNumber,
              physicalIndex
            );


          booklet.appendChild(
            miniPage
          );

        }

      );


      /*
        Pomocná značka středového střihu.
      */

      const cutLine =
        document.createElement(
          "div"
        );


      cutLine.className =
        "cut-line";


      booklet.appendChild(
        cutLine
      );


      const cutLabel =
        document.createElement(
          "div"
        );


      cutLabel.className =
        "cut-label";


      cutLabel.textContent =
        "STŘIH";


      booklet.appendChild(
        cutLabel
      );

    }


    /* ================================================= */
    /* JEDNA MINI STRÁNKA */
    /* ================================================= */

    function createMiniPage(
      pageNumber,
      physicalIndex
    ){

      const element =
        document.createElement(
          "article"
        );


      element.className =
        "mini-page";


      /*
        Indexy 4–7 jsou spodní řada.
      */

      if(
        physicalIndex >= 4
      ){

        element.classList.add(
          "bottom"
        );

      }


      /*
        Skutečný obsah stránky.
        pageNumber 1 = index 0.
      */

      const pageContent =
        bookletLayout[
          currentReligion
        ][
          pageNumber - 1
        ];


      /*
        Titulní strana.
      */

      if(
        pageContent ===
        "__COVER__"
      ){

        element.classList.add(
          "cover-page"
        );


        element.innerHTML = `

          <div class="page-inner">

            <div class="cover-symbol">

              ${
                religionInfo[
                  currentReligion
                ].icon
              }

            </div>


            <h2 class="cover-title">

              ${
                religionInfo[
                  currentReligion
                ].name
              }

            </h2>


            <div class="cover-subtitle">

              Třídní mini knížka

            </div>

          </div>

        `;


        return element;

      }


      /*
        Normální téma.
      */

      const finalKey =
        createFinalKey(

          currentReligion,

          pageContent

        );


      const text =
        finalTexts[
          finalKey
        ] || "";


      element.innerHTML = `

        <div class="page-inner">


          <div class="page-number">

            Strana ${pageNumber}

          </div>


          <h2 class="topic-title">

            ${escapeHTML(
              pageContent || ""
            )}

          </h2>


          <div class="topic-text">

            ${
              text.trim()

              ?

              escapeHTML(text)

              :

              `
              <span class="empty">
                Finální text zatím nebyl doplněn.
              </span>
              `
            }

          </div>


        </div>

      `;


      return element;

    }


    /* ================================================= */
    /* KLÍČ FINÁLNÍHO TEXTU */
    /* ================================================= */

    function createFinalKey(
      religion,
      topic
    ){

      return (

        "final_" +

        normalizeText(
          religion
        ) +

        "_" +

        normalizeText(
          topic
        )

      );

    }


    /* ================================================= */
    /* NORMALIZACE */
    /* ================================================= */

    function normalizeText(
      text
    ){

      return String(
        text || ""
      )

      .normalize(
        "NFD"
      )

      .replace(
        /[\u0300-\u036f]/g,
        ""
      )

      .toLowerCase()

      .replace(
        /[^a-z0-9]+/g,
        "_"
      )

      .replace(
        /^_+|_+$/g,
        ""
      );

    }


    /* ================================================= */
    /* OCHRANA HTML */
    /* ================================================= */

    function escapeHTML(
      text
    ){

      return String(
        text || ""
      )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

    }

  </script>

</body>

</html>
