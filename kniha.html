<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Tisk knížečky | Křesťanství × Islám
  </title>

  <style>

    :root{

      --bg:#eee8dd;
      --paper:#ffffff;
      --ink:#2d2a26;
      --muted:#746d63;
      --line:#cfc5b6;

      --christian:#6f4e37;
      --islam:#3e6b57;

      --shadow:
        0 18px 45px rgba(55,42,28,.14);

    }


    *{
      box-sizing:border-box;
    }


    html,
    body{

      margin:0;

      min-height:100%;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color:var(--ink);

      background:var(--bg);

    }


    button{
      font-family:inherit;
    }


    /* ================================================= */
    /* HORNÍ LIŠTA */
    /* ================================================= */

    .toolbar{

      position:sticky;

      top:0;

      z-index:100;

      display:flex;

      justify-content:space-between;

      align-items:center;

      gap:20px;

      padding:14px 22px;

      background:#2d2a26;

      color:white;

      box-shadow:
        0 4px 15px rgba(0,0,0,.18);

    }


    .toolbar-title{

      font-size:1.05rem;

      font-weight:700;

    }


    .toolbar-buttons{

      display:flex;

      flex-wrap:wrap;

      gap:9px;

    }


    .toolbar-button{

      padding:9px 14px;

      border:
        1px solid rgba(255,255,255,.25);

      border-radius:9px;

      background:transparent;

      color:white;

      cursor:pointer;

      transition:.2s;

    }


    .toolbar-button:hover{

      background:
        rgba(255,255,255,.1);

    }


    .toolbar-button.active{

      background:white;

      color:#2d2a26;

      border-color:white;

    }


    .toolbar-button.print{

      background:white;

      color:#2d2a26;

      border-color:white;

      font-weight:700;

    }


    /* ================================================= */
    /* OBSAH */
    /* ================================================= */

    .wrapper{

      width:
        min(
          1250px,
          calc(100% - 30px)
        );

      margin:
        28px auto 70px;

    }


    .intro{

      background:#fffdf8;

      border:
        1px solid var(--line);

      border-radius:20px;

      box-shadow:var(--shadow);

      padding:26px 30px;

      margin-bottom:24px;

    }


    .intro-label{

      text-transform:uppercase;

      letter-spacing:.14em;

      font-size:.72rem;

      color:var(--muted);

      font-weight:700;

      margin-bottom:7px;

    }


    .intro h1{

      margin:0 0 9px;

      font-size:
        clamp(
          2rem,
          5vw,
          3rem
        );

    }


    .intro p{

      margin:0;

      color:var(--muted);

      line-height:1.6;

    }


    /* ================================================= */
    /* A4 */
    /* ================================================= */

    .paper-shell{

      overflow:auto;

      padding:18px 0;

    }


    .booklet{

      width:297mm;

      height:210mm;

      margin:0 auto;

      display:grid;

      grid-template-columns:
        repeat(4,1fr);

      grid-template-rows:
        repeat(2,1fr);

      background:white;

      box-shadow:
        0 15px 45px rgba(0,0,0,.17);

      overflow:hidden;

      position:relative;

    }


    /* ================================================= */
    /* MINI STRÁNKA */
    /* ================================================= */

    .mini-page{

      position:relative;

      overflow:hidden;

      padding:7mm 6.5mm;

      border-right:
        .3mm dashed #aaa;

      border-bottom:
        .3mm dashed #aaa;

      background:white;

    }


    .mini-page:nth-child(4),
    .mini-page:nth-child(8){

      border-right:none;

    }


    .mini-page:nth-child(n+5){

      border-bottom:none;

    }


    /* ================================================= */
    /* SPODNÍ ŘADA */
    /* ================================================= */

    .mini-page.bottom{

      transform:
        rotate(180deg);

    }


    /* ================================================= */
    /* VNITŘEK */
    /* ================================================= */

    .page-inner{

      height:100%;

      display:flex;

      flex-direction:column;

    }


    .page-number{

      text-transform:uppercase;

      letter-spacing:.1em;

      font-size:7pt;

      color:var(--muted);

      margin-bottom:2.5mm;

    }


    .topic-title{

      margin:
        0 0 3.5mm;

      padding-bottom:2.2mm;

      border-bottom:
        .4mm solid currentColor;

      font-size:14pt;

      line-height:1.1;

      font-weight:700;

    }


    .booklet.christian
    .topic-title{

      color:var(--christian);

    }


    .booklet.islam
    .topic-title{

      color:var(--islam);

    }


    .topic-text{

      flex:1;

      font-size:8.8pt;

      line-height:1.32;

      white-space:pre-wrap;

      overflow-wrap:anywhere;

      overflow:hidden;

    }


    .empty{

      color:#aaa;

      font-style:italic;

    }


    /* ================================================= */
    /* DVĚ TÉMATA NA JEDNÉ STRANĚ */
    /* ================================================= */

    .double-page{

      display:grid;

      grid-template-rows:
        1fr 1fr;

      gap:3.5mm;

    }


    .double-topic{

      min-height:0;

      overflow:hidden;

    }


    .double-topic:first-child{

      padding-bottom:3mm;

      border-bottom:
        .3mm solid var(--line);

    }


    .double-topic .topic-title{

      font-size:11.5pt;

      margin-bottom:2mm;

      padding-bottom:1.5mm;

    }


    .double-topic .topic-text{

      font-size:7.4pt;

      line-height:1.22;

    }


    /* ================================================= */
    /* STŘIH */
    /* ================================================= */

    .cut-line{

      position:absolute;

      z-index:20;

      left:25%;

      right:25%;

      top:50%;

      border-top:
        .35mm dashed rgba(180,50,50,.5);

      pointer-events:none;

    }


    .cut-label{

      position:absolute;

      z-index:21;

      left:50%;

      top:50%;

      transform:
        translate(-50%,-50%);

      padding:
        1mm 2mm;

      background:white;

      color:#b44b43;

      font-size:6pt;

      letter-spacing:.06em;

    }


    /* ================================================= */
    /* TISK */
    /* ================================================= */

    @media print{

      @page{

        size:A4 landscape;

        margin:0;

      }


      html,
      body{

        width:297mm;

        height:210mm;

        margin:0;

        padding:0;

        background:white;

      }


      .toolbar,
      .intro{

        display:none !important;

      }


      .wrapper{

        width:297mm;

        height:210mm;

        margin:0;

        padding:0;

      }


      .paper-shell{

        width:297mm;

        height:210mm;

        padding:0;

        margin:0;

        overflow:hidden;

      }


      .booklet{

        width:297mm;

        height:210mm;

        margin:0;

        box-shadow:none;

      }

    }


    /* ================================================= */
    /* MENŠÍ OBRAZOVKY */
    /* ================================================= */

    @media(max-width:900px){

      .toolbar{

        flex-direction:column;

        align-items:flex-start;

      }

    }

  </style>

</head>


<body>


  <!-- ================================================= -->
  <!-- OVLÁDÁNÍ -->
  <!-- ================================================= -->

  <header class="toolbar">

    <div class="toolbar-title">

      Tisk mini knížečky

    </div>


    <div class="toolbar-buttons">


      <button
        id="christianButton"
        class="toolbar-button active"
        onclick="showReligion('krestanstvi')"
      >
        ✝ Křesťanství
      </button>


      <button
        id="islamButton"
        class="toolbar-button"
        onclick="showReligion('islam')"
      >
        ☪ Islám
      </button>


      <button
        class="toolbar-button"
        onclick="window.location.href='ucitel.html?v=' + Date.now()"
      >
        ← Upravit texty
      </button>


      <button
        class="toolbar-button print"
        onclick="window.print()"
      >
        PDF / TISK
      </button>

    </div>

  </header>


  <!-- ================================================= -->
  <!-- NÁHLED -->
  <!-- ================================================= -->

  <main class="wrapper">


    <section class="intro">

      <div class="intro-label">

        Náhled pro tisk

      </div>


      <h1 id="previewTitle">

        Křesťanství

      </h1>


      <p>

        Jedna A4 naležato rozdělená na osm částí.
        Spodní řada je automaticky otočená o 180°.

      </p>

    </section>


    <div class="paper-shell">


      <section
        id="booklet"
        class="booklet christian"
      >
      </section>


    </div>

  </main>


  <script>

    /* ================================================= */
    /* ROZLOŽENÍ OBSAHU */
    /* ================================================= */

    /*
      8 výsledných stran.

      Jedna z nich obsahuje dvě témata:
      Kniha + Kde se modlí.
    */

    const bookletLayout = {

      krestanstvi: [

        "Vznik",

        "Symboly",

        "Organizace",

        "Rozdělení",

        "__DOUBLE__:Kniha|Kde se modlí",

        "Známý příběh",

        "Svátky",

        "Známí lidé"

      ],


      islam: [

        "Vznik",

        "Symboly",

        "5 pilířů",

        "Rozšíření",

        "__DOUBLE__:Kniha|Kde se modlí",

        "Poutní místo",

        "Arabská věda",

        "Známí lidé"

      ]

    };


    /* ================================================= */
    /* FYZICKÉ ROZLOŽENÍ NA A4 */
    /* ================================================= */

    /*
      Horní řada:

      8 | 1 | 2 | 3

      Spodní řada:

      7 | 6 | 5 | 4

      Spodní řada se otočí o 180°.
    */

    const printOrder = [

      8,
      1,
      2,
      3,

      7,
      6,
      5,
      4

    ];


    /* ================================================= */
    /* NÁBOŽENSTVÍ */
    /* ================================================= */

    const religionInfo = {

      krestanstvi: {

        name:"Křesťanství",

        className:"christian"

      },


      islam: {

        name:"Islám",

        className:"islam"

      }

    };


    /* ================================================= */
    /* FINÁLNÍ TEXTY */
    /* ================================================= */

    let finalTexts = {};


    try{

      finalTexts =
        JSON.parse(
          localStorage.getItem(
            "finalBookTexts"
          )
        ) || {};

    }

    catch(error){

      console.error(
        "Nepodařilo se načíst finální texty.",
        error
      );

      finalTexts = {};

    }


    /* ================================================= */
    /* AKTUÁLNÍ NÁBOŽENSTVÍ */
    /* ================================================= */

    let currentReligion =
      "krestanstvi";


    renderBooklet();


    /* ================================================= */
    /* PŘEPÍNÁNÍ */
    /* ================================================= */

    window.showReligion =
      function(religion){


        currentReligion =
          religion;


        document
          .getElementById(
            "christianButton"
          )
          .classList.toggle(

            "active",

            religion ===
              "krestanstvi"

          );


        document
          .getElementById(
            "islamButton"
          )
          .classList.toggle(

            "active",

            religion ===
              "islam"

          );


        renderBooklet();

      };


    /* ================================================= */
    /* VYKRESLENÍ */
    /* ================================================= */

    function renderBooklet(){

      const booklet =
        document.getElementById(
          "booklet"
        );


      const info =
        religionInfo[
          currentReligion
        ];


      booklet.className =
        "booklet " +
        info.className;


      document.getElementById(
        "previewTitle"
      ).textContent =
        info.name;


      booklet.innerHTML =
        "";


      printOrder.forEach(

        (
          pageNumber,
          physicalIndex
        ) => {


          const miniPage =
            createMiniPage(

              pageNumber,

              physicalIndex

            );


          booklet.appendChild(
            miniPage
          );

        }

      );


      /*
        Čára pro prostřední střih.
      */

      const cutLine =
        document.createElement(
          "div"
        );


      cutLine.className =
        "cut-line";


      booklet.appendChild(
        cutLine
      );


      const cutLabel =
        document.createElement(
          "div"
        );


      cutLabel.className =
        "cut-label";


      cutLabel.textContent =
        "STŘIH";


      booklet.appendChild(
        cutLabel
      );

    }


    /* ================================================= */
    /* JEDNA STRANA */
    /* ================================================= */

    function createMiniPage(
      pageNumber,
      physicalIndex
    ){

      const element =
        document.createElement(
          "article"
        );


      element.className =
        "mini-page";


      /*
        Spodní řada.
      */

      if(
        physicalIndex >= 4
      ){

        element.classList.add(
          "bottom"
        );

      }


      /*
        Obsah podle skutečného čísla stránky.
      */

      const pageContent =
        bookletLayout[
          currentReligion
        ][
          pageNumber - 1
        ];


      /*
        ===============================
        DVĚ TÉMATA
        ===============================
      */

      if(
        pageContent.startsWith(
          "__DOUBLE__:"
        )
      ){

        const names =
          pageContent
            .replace(
              "__DOUBLE__:",
              ""
            )
            .split("|");


        const topic1 =
          names[0];


        const topic2 =
          names[1];


        const key1 =
          createFinalKey(

            currentReligion,

            topic1

          );


        const key2 =
          createFinalKey(

            currentReligion,

            topic2

          );


        const text1 =
          finalTexts[
            key1
          ] || "";


        const text2 =
          finalTexts[
            key2
          ] || "";


        element.innerHTML = `

          <div class="page-inner double-page">


            <div class="double-topic">

              <div class="page-number">

                Strana ${pageNumber}

              </div>


              <h2 class="topic-title">

                ${escapeHTML(
                  topic1
                )}

              </h2>


              <div class="topic-text">

                ${
                  text1.trim()

                  ?

                  escapeHTML(
                    text1
                  )

                  :

                  `
                  <span class="empty">
                    Finální text zatím nebyl doplněn.
                  </span>
                  `
                }

              </div>

            </div>


            <div class="double-topic">

              <h2 class="topic-title">

                ${escapeHTML(
                  topic2
                )}

              </h2>


              <div class="topic-text">

                ${
                  text2.trim()

                  ?

                  escapeHTML(
                    text2
                  )

                  :

                  `
                  <span class="empty">
                    Finální text zatím nebyl doplněn.
                  </span>
                  `
                }

              </div>

            </div>


          </div>

        `;


        return element;

      }


      /*
        ===============================
        JEDNO TÉMA
        ===============================
      */

      const finalKey =
        createFinalKey(

          currentReligion,

          pageContent

        );


      const text =
        finalTexts[
          finalKey
        ] || "";


      element.innerHTML = `

        <div class="page-inner">


          <div class="page-number">

            Strana ${pageNumber}

          </div>


          <h2 class="topic-title">

            ${escapeHTML(
              pageContent
            )}

          </h2>


          <div class="topic-text">

            ${
              text.trim()

              ?

              escapeHTML(
                text
              )

              :

              `
              <span class="empty">
                Finální text zatím nebyl doplněn.
              </span>
              `
            }

          </div>


        </div>

      `;


      return element;

    }


    /* ================================================= */
    /* FINÁLNÍ KLÍČ */
    /* ================================================= */

    function createFinalKey(
      religion,
      topic
    ){

      return (

        "final_" +

        normalizeText(
          religion
        ) +

        "_" +

        normalizeText(
          topic
        )

      );

    }


    /* ================================================= */
    /* NORMALIZACE */
    /* ================================================= */

    function normalizeText(
      text
    ){

      return String(
        text || ""
      )

      .normalize(
        "NFD"
      )

      .replace(
        /[\u0300-\u036f]/g,
        ""
      )

      .toLowerCase()

      .replace(
        /[^a-z0-9]+/g,
        "_"
      )

      .replace(
        /^_+|_+$/g,
        ""
      );

    }


    /* ================================================= */
    /* OCHRANA HTML */
    /* ================================================= */

    function escapeHTML(
      text
    ){

      return String(
        text || ""
      )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

    }

  </script>

</body>

</html>
